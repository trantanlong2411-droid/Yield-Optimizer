name: Yield Optimizer — live three-vault on-chain comparison
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests-and-worker-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Test three-vault math, net profit, risk gates, invalid input and website
        run: npm test
      - name: Replay user-exported evidence and verify all calculations
        run: node scripts/verify-user-export.mjs
      - name: Build Cloudflare Worker
        run: npm run build
  live-three-yield-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Verify all three historical on-chain yields, USDC asset and fee-aware decision
        run: node scripts/smoke-deployed.mjs
      - name: Export real vault and oracle evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pharos-yield-optimizer-mainnet-proof
          path: proof/live-yield-proof.json
          retention-days: 30
          if-no-files-found: error
